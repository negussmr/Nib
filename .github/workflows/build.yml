name: Build Nib
on:
  push:
    paths: ['*.zip', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unpack and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unzip -oq "$(ls *.zip | head -1)" -d src
          bash src/*/ci/build.sh
