name: Report build failure
on:
  workflow_run:
    workflows: ["Build Nib"]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  report:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Save the error log into the repo
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p build-logs
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tail -n 400 > build-logs/latest.txt || true
          git config user.name "nib-build"
          git config user.email "nib-build@users.noreply.github.com"
          git add build-logs
          git commit -m "Save build error log" || true
          git push
